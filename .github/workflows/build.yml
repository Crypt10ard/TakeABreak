# Builds the installers on GitHub: Windows (.exe) and macOS (universal .dmg).
# Run it from the "Actions" tab (workflow_dispatch) or push a tag like v1.0.0.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No certificates configured: Windows stays unsigned, macOS is signed ad hoc (see README).
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: atem-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
