<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atem</title>
    <link rel="stylesheet" href="./bundle.css" />
  </head>
  <body class="is-intro">
    <canvas id="gl" class="gl" aria-hidden="true"></canvas>
    <div class="ambient" aria-hidden="true"><i></i><i></i></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- window bar ---------------------------------------------------------->
    <header class="bar" id="bar">
      <a class="bar__brand" href="#hero" data-goto="hero" data-i18n-aria="bar.home">
        <span class="bar__logo" aria-hidden="true"></span>
        <span>Atem</span>
      </a>
      <div class="bar__status" id="bar-status">
        <span class="bar__pulse" aria-hidden="true"></span>
        <span id="bar-status-text">&nbsp;</span>
      </div>
      <div class="bar__spacer"></div>
      <div class="bar__saved" id="saved" role="status" aria-live="polite">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
        <span data-i18n="bar.saved">Gespeichert</span>
      </div>
      <div class="bar__lang" id="bar-lang" role="radiogroup" data-i18n-aria="bar.language">
        <span class="bar__lang-glider" aria-hidden="true"></span>
        <button role="radio" data-lang="de">DE</button>
        <button role="radio" data-lang="en">EN</button>
      </div>
      <button class="bar__theme" id="bar-theme" data-i18n-aria="bar.theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <mask id="moon-cut">
            <rect width="24" height="24" fill="#fff" />
            <circle class="theme-icon__cut" cx="17" cy="7" r="6" fill="#000" />
          </mask>
          <circle class="theme-icon__core" cx="12" cy="12" r="7.5" mask="url(#moon-cut)" />
          <g class="theme-icon__rays">
            <path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7" />
          </g>
        </svg>
      </button>
      <div class="bar__controls" id="win-controls">
        <button data-win="minimize" data-i18n-aria="bar.minimize">
          <svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg>
        </button>
        <button data-win="maximize" data-i18n-aria="bar.maximize">
          <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
        </button>
        <button data-win="close" data-i18n-aria="bar.close">
          <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg>
        </button>
      </div>
    </header>

    <!-- section rail -------------------------------------------------------->
    <nav class="rail" id="rail" data-i18n-aria="rail.label">
      <a href="#hero" data-goto="hero"><span class="rail__num">00</span><span class="rail__txt" data-i18n="rail.hero"></span></a>
      <a href="#rhythm" data-goto="rhythm"><span class="rail__num">01</span><span class="rail__txt" data-i18n="rail.rhythm"></span></a>
      <a href="#eyes" data-goto="eyes"><span class="rail__num">02</span><span class="rail__txt" data-i18n="rail.eyes"></span></a>
      <a href="#program" data-goto="program"><span class="rail__num">03</span><span class="rail__txt" data-i18n="rail.program"></span></a>
      <a href="#strict" data-goto="strict"><span class="rail__num">04</span><span class="rail__txt" data-i18n="rail.strict"></span></a>
      <a href="#stats" data-goto="stats"><span class="rail__num">05</span><span class="rail__txt" data-i18n="rail.stats"></span></a>
      <a href="#system" data-goto="system"><span class="rail__num">06</span><span class="rail__txt" data-i18n="rail.system"></span></a>
    </nav>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>

    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main>
          <!-- 00 hero ------------------------------------------------------>
          <section class="hero" id="hero" data-section="hero">
            <div class="hero__anchor" data-orb-anchor></div>
            <div class="hero__top">
              <p class="label"><span class="label__num">(00)</span> <span data-i18n="hero.kicker"></span></p>
              <p class="label" id="hero-date">&nbsp;</p>
            </div>
            <h1 class="hero__title display" id="hero-title">
              <span class="hero__line"><span data-i18n="hero.line1"></span></span>
              <span class="hero__line hero__line--em"><em data-i18n="hero.line2"></em></span>
            </h1>
            <div class="hero__bottom">
              <div class="hero__status">
                <p class="label" id="hero-label">&nbsp;</p>
                <div class="hero__time display tabular" id="hero-time">00:00</div>
                <div class="hero__meter"><i id="hero-meter"></i></div>
                <p class="hero__sub" id="hero-sub">&nbsp;</p>
              </div>
              <div class="hero__actions">
                <button class="btn btn--primary btn--lg" id="hero-break">
                  <span id="hero-break-label">&nbsp;</span>
                  <span class="btn__arrow" aria-hidden="true">→</span>
                </button>
                <div class="pausemenu" id="pausemenu">
                  <button class="btn btn--ghost btn--lg" id="hero-pause" aria-haspopup="menu" aria-expanded="false" data-i18n="hero.pause"></button>
                  <div class="pausemenu__list" role="menu">
                    <button role="menuitem" data-pause="30" data-i18n="hero.p30"></button>
                    <button role="menuitem" data-pause="60" data-i18n="hero.p60"></button>
                    <button role="menuitem" data-pause="120" data-i18n="hero.p120"></button>
                    <button role="menuitem" data-pause="tomorrow" data-i18n="hero.tomorrow"></button>
                  </div>
                </div>
              </div>
              <div class="hero__scroll" aria-hidden="true">
                <span class="label" data-i18n="hero.scroll"></span>
                <i></i>
              </div>
            </div>
          </section>

          <div class="marquee" aria-hidden="true">
            <div class="marquee__track">
              <span data-i18n-html="marquee"></span>
              <span data-i18n-html="marquee"></span>
            </div>
          </div>

          <!-- 01 rhythm ---------------------------------------------------->
          <section class="sec rhythm" id="rhythm" data-section="rhythm">
            <header class="sec__head">
              <p class="label"><span class="label__num">(01)</span> <span data-i18n="rhythm.label"></span></p>
              <h2 class="sec__title display" data-split data-i18n-html="rhythm.title"></h2>
              <p class="sec__lead" data-reveal data-i18n="rhythm.lead"></p>
            </header>

            <div class="rhythm__grid">
              <div class="rhythm__controls" data-reveal>
                <div class="presets" id="presets">
                  <button data-preset="25,5"><b data-i18n="rhythm.pomodoro"></b><span>25 / 5</span></button>
                  <button data-preset="55,5"><b data-i18n="rhythm.classic"></b><span>55 / 5</span></button>
                  <button data-preset="90,15"><b data-i18n="rhythm.deep"></b><span>90 / 15</span></button>
                </div>
                <div class="dial">
                  <div class="dial__head">
                    <span class="label" data-i18n="rhythm.focus"></span>
                    <span class="dial__value display"><span class="tabular" id="work-num">55</span><em>min</em></span>
                  </div>
                  <div id="ruler-work"></div>
                </div>
                <div class="dial">
                  <div class="dial__head">
                    <span class="label" data-i18n="rhythm.break"></span>
                    <span class="dial__value display"><span class="tabular" id="rest-num">5</span><em>min</em></span>
                  </div>
                  <div id="ruler-rest"></div>
                </div>
              </div>

              <figure class="cycle" data-reveal>
                <div class="cycle__ring" id="cycle"></div>
                <div class="cycle__core" data-orb-anchor></div>
                <figcaption class="cycle__legend">
                  <span><i class="dot dot--work"></i><b id="legend-work">55</b> <span data-i18n="rhythm.legendFocus"></span></span>
                  <span><i class="dot dot--rest"></i><b id="legend-rest">5</b> <span data-i18n="rhythm.legendBreak"></span></span>
                  <span id="legend-micro-wrap"
                    ><i class="dot dot--micro"></i><b id="legend-micro">2</b> <span data-i18n="rhythm.legendMicro"></span
                  ></span>
                  <span class="cycle__total"><b id="cycle-total">60</b> <span data-i18n="rhythm.legendCycle"></span></span>
                </figcaption>
              </figure>
            </div>

            <p class="insight" id="insight" data-reveal>&nbsp;</p>
          </section>

          <!-- 02 eyes ------------------------------------------------------>
          <section class="sec eyes" id="eyes" data-section="eyes">
            <div class="eyes__grid">
              <div class="eyes__text">
                <p class="label"><span class="label__num">(02)</span> <span data-i18n="eyes.label"></span></p>
                <h2 class="eyes__rule display" data-i18n-aria="eyes.ruleAria">
                  <span class="tabular" id="rule-interval">20</span><i>·</i><span class="tabular" id="rule-duration">20</span
                  ><i>·</i><span>20</span>
                </h2>
                <ol class="eyes__legend" data-reveal>
                  <li><b id="legend-interval"></b> <span data-i18n="eyes.lookUp"></span></li>
                  <li><b id="legend-duration"></b> <span data-i18n="eyes.long"></span></li>
                  <li><b data-i18n="eyes.distance"></b> <span data-i18n="eyes.far"></span></li>
                </ol>
                <p class="sec__lead" data-reveal data-i18n="eyes.lead"></p>
                <div class="rows" data-reveal>
                  <div class="row">
                    <div class="row__text">
                      <h4 data-i18n="eyes.micro"></h4>
                      <p data-i18n="eyes.microDesc"></p>
                    </div>
                    <button class="toggle" id="micro-enabled" data-i18n-aria="eyes.micro"></button>
                  </div>
                  <div class="row" data-needs-micro>
                    <div class="row__text"><h4 data-i18n="eyes.interval"></h4></div>
                    <div id="micro-interval"></div>
                  </div>
                  <div class="row" data-needs-micro>
                    <div class="row__text"><h4 data-i18n="eyes.duration"></h4></div>
                    <div id="micro-duration"></div>
                  </div>
                  <div class="row" data-needs-micro>
                    <div class="row__text">
                      <h4 data-i18n="eyes.style"></h4>
                      <p data-i18n="eyes.styleDesc"></p>
                    </div>
                    <div class="seg seg--small" id="micro-style">
                      <button data-value="capsule" data-i18n="eyes.capsule"></button>
                      <button data-value="fullscreen" data-i18n="eyes.fullscreen"></button>
                    </div>
                  </div>
                </div>
              </div>
              <figure class="eye" id="eye" data-cursor="blink" aria-hidden="true"></figure>
            </div>
          </section>

          <!-- 03 program (pinned, horizontal) ------------------------------>
          <section class="program" id="program" data-section="program">
            <div class="program__pin">
              <header class="program__head">
                <p class="label"><span class="label__num">(03)</span> <span data-i18n="program.label"></span></p>
                <h2 class="sec__title display" data-split data-i18n-html="program.title"></h2>
                <p class="sec__lead" data-i18n="program.lead"></p>
              </header>
              <div class="program__viewport">
                <div class="program__track" id="program-track">
                  <article class="card" data-activity="breath">
                    <header class="card__top">
                      <span class="label">01</span>
                      <button class="toggle" data-name="program.breath"></button>
                    </header>
                    <div class="card__visual" data-visual="breath"></div>
                    <h3 class="card__title display" data-i18n="program.breath"></h3>
                    <p class="card__text" data-i18n="program.breathDesc"></p>
                    <div class="seg seg--small seg--wide" id="breath-pattern">
                      <button data-value="calm" data-i18n="program.calm"></button>
                      <button data-value="box" data-i18n="program.box"></button>
                      <button data-value="478" data-i18n="program.478"></button>
                    </div>
                  </article>
                  <article class="card" data-activity="eyes">
                    <header class="card__top">
                      <span class="label">02</span>
                      <button class="toggle" data-name="program.eyes"></button>
                    </header>
                    <div class="card__visual" data-visual="eyes"></div>
                    <h3 class="card__title display" data-i18n="program.eyes"></h3>
                    <p class="card__text" data-i18n="program.eyesDesc"></p>
                  </article>
                  <article class="card" data-activity="stretch">
                    <header class="card__top">
                      <span class="label">03</span>
                      <button class="toggle" data-name="program.stretch"></button>
                    </header>
                    <div class="card__visual" data-visual="stretch"></div>
                    <h3 class="card__title display" data-i18n="program.stretch"></h3>
                    <p class="card__text" data-i18n="program.stretchDesc"></p>
                  </article>
                  <article class="card" data-activity="move">
                    <header class="card__top">
                      <span class="label">04</span>
                      <button class="toggle" data-name="program.move"></button>
                    </header>
                    <div class="card__visual" data-visual="move"></div>
                    <h3 class="card__title display" data-i18n="program.move"></h3>
                    <p class="card__text" data-i18n="program.moveDesc"></p>
                  </article>
                  <article class="card card--cta">
                    <p class="label" data-i18n="program.ready"></p>
                    <h3 class="card__title display" data-i18n-html="program.ctaTitle"></h3>
                    <div class="card__cta">
                      <button class="btn btn--accent btn--lg" id="try-break">
                        <span data-i18n="program.try"></span> <span class="btn__meta">60 s</span>
                      </button>
                      <button class="btn btn--ghost" id="try-micro" data-i18n="program.tryMicro"></button>
                    </div>
                  </article>
                </div>
              </div>
              <div class="program__bar"><i id="program-bar"></i></div>
            </div>
          </section>

          <!-- 04 strictness ------------------------------------------------>
          <section class="sec strict" id="strict" data-section="strict">
            <header class="sec__head">
              <p class="label"><span class="label__num">(04)</span> <span data-i18n="strict.label"></span></p>
              <h2 class="sec__title display" data-split data-i18n-html="strict.title"></h2>
            </header>
            <div class="strict__grid">
              <div class="strict__main" data-reveal>
                <div class="seg seg--large" id="strictness">
                  <button data-value="gentle" data-i18n="strict.gentle"></button>
                  <button data-value="balanced" data-i18n="strict.balanced"></button>
                  <button data-value="strict" data-i18n="strict.strict"></button>
                </div>
                <div class="strict__copy" id="strict-copy">
                  <p class="strict__quote display" id="strict-quote">&nbsp;</p>
                  <ul class="strict__facts" id="strict-facts"></ul>
                </div>
              </div>
              <aside class="strict__side" data-reveal>
                <div class="tryhold">
                  <p class="label" data-i18n="strict.try"></p>
                  <button class="hold btn btn--ghost btn--lg" id="demo-hold">
                    <span class="hold__fill"></span>
                    <span class="hold__label" id="demo-hold-label">&nbsp;</span>
                  </button>
                  <p class="tryhold__hint" id="demo-hint">&nbsp;</p>
                </div>
                <div class="rows">
                  <div class="row">
                    <div class="row__text">
                      <h4 data-i18n="strict.warn"></h4>
                      <p data-i18n="strict.warnDesc"></p>
                    </div>
                    <button class="toggle" id="warn-enabled" data-i18n-aria="strict.warn"></button>
                  </div>
                  <div class="row" data-needs-warn>
                    <div class="row__text"><h4 data-i18n="strict.lead"></h4></div>
                    <div id="warn-seconds"></div>
                  </div>
                  <div class="row">
                    <div class="row__text">
                      <h4 data-i18n="strict.snoozeBy"></h4>
                      <p data-i18n="strict.snoozeByDesc"></p>
                    </div>
                    <div id="snooze-minutes"></div>
                  </div>
                </div>
              </aside>
            </div>

            <!-- front desk mode -->
            <div class="front" id="front" data-reveal>
              <div class="front__copy">
                <p class="label front__label">
                  <span class="front__led" aria-hidden="true"></span><span data-i18n="front.label"></span>
                </p>
                <h3 class="front__title display" data-i18n-html="front.title"></h3>
                <p class="front__text" data-i18n="front.text"></p>
                <div class="rows front__rows">
                  <div class="row">
                    <div class="row__text">
                      <h4 data-i18n="front.enable"></h4>
                      <p data-i18n="front.enableDesc"></p>
                    </div>
                    <button class="toggle" id="reception-enabled" data-i18n-aria="front.enable"></button>
                  </div>
                  <div class="row" data-needs-reception>
                    <div class="row__text">
                      <h4 data-i18n="front.return"></h4>
                      <p data-i18n="front.returnDesc"></p>
                    </div>
                    <div id="reception-return"></div>
                  </div>
                </div>
              </div>
              <figure class="fd" id="front-demo" aria-hidden="true">
                <div class="fd__screen">
                  <div class="fd__app">
                    <span class="fd__top"></span>
                    <span class="fd__side"></span>
                    <span class="fd__line" style="--y: 19%; --w: 38%"></span>
                    <span class="fd__line" style="--y: 28%; --w: 56%"></span>
                    <span class="fd__line" style="--y: 37%; --w: 47%"></span>
                    <span class="fd__card"><i class="fd__hit"></i><span class="fd__line" style="--y: 30%; --w: 60%"></span><span class="fd__line" style="--y: 58%; --w: 38%"></span></span>
                  </div>
                  <div class="fd__overlay"></div>
                  <span class="fd__orb"></span>
                  <span class="fd__btn"><span data-i18n="break.aside"></span><kbd>Esc</kbd></span>
                  <span class="fd__pill"><i class="fd__ring"></i><span class="fd__time tabular">10:00</span></span>
                  <span class="fd__cursor"></span>
                </div>
              </figure>
            </div>
          </section>

          <!-- 05 stats ----------------------------------------------------->
          <section class="sec stats" id="stats" data-section="stats">
            <header class="sec__head">
              <p class="label"><span class="label__num">(05)</span> <span data-i18n="stats.label"></span></p>
              <h2 class="sec__title display" data-split data-i18n-html="stats.title"></h2>
              <p class="sec__lead" id="stats-sentence" data-reveal>&nbsp;</p>
            </header>
            <div class="tiles" data-reveal-stagger>
              <div class="tile tile--ring">
                <svg class="tile__ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle cx="60" cy="60" r="52" class="tile__ring-track" />
                  <circle cx="60" cy="60" r="52" class="tile__ring-fill" id="compliance-ring" />
                </svg>
                <p class="tile__value display"><span data-count id="stat-taken">0</span><em>/<span id="stat-due">0</span></em></p>
                <p class="label" data-i18n="stats.taken"></p>
              </div>
              <div class="tile">
                <p class="tile__value display">
                  <span data-count id="stat-focus-h">0</span><em>h</em> <span data-count id="stat-focus-m">0</span><em>min</em>
                </p>
                <p class="label" data-i18n="stats.active"></p>
              </div>
              <div class="tile">
                <p class="tile__value display"><span data-count id="stat-micro">0</span></p>
                <p class="label" data-i18n="stats.micro"></p>
              </div>
              <div class="tile">
                <p class="tile__value display"><span data-count id="stat-streak">0</span><em id="stat-streak-unit"></em></p>
                <p class="label" data-i18n="stats.streak"></p>
              </div>
            </div>
            <figure class="week" data-reveal>
              <figcaption class="week__head">
                <span class="label" data-i18n="stats.week"></span>
                <span class="label week__legend"
                  ><i class="dot dot--rest"></i> <span data-i18n="stats.legendBreaks"></span> <i class="dot dot--muted"></i>
                  <span data-i18n="stats.legendSkipped"></span
                ></span>
              </figcaption>
              <div class="week__bars" id="week"></div>
            </figure>
          </section>

          <!-- 06 system ---------------------------------------------------->
          <section class="sec system" id="system" data-section="system">
            <header class="sec__head">
              <p class="label"><span class="label__num">(06)</span> <span data-i18n="system.label"></span></p>
              <h2 class="sec__title display" data-split data-i18n-html="system.title"></h2>
            </header>
            <div class="system__grid">
              <div class="rows rows--list" data-reveal>
                <div class="row">
                  <div class="row__text">
                    <h4 data-i18n="system.appearance"></h4>
                    <p data-i18n="system.appearanceDesc"></p>
                  </div>
                  <div class="seg seg--small" id="theme-seg">
                    <button data-value="dark" data-i18n="theme.dark"></button>
                    <button data-value="light" data-i18n="theme.light"></button>
                    <button data-value="system" data-i18n="theme.system"></button>
                  </div>
                </div>
                <div class="row">
                  <div class="row__text">
                    <h4 data-i18n="system.language"></h4>
                    <p data-i18n="system.languageDesc"></p>
                  </div>
                  <div class="seg seg--small" id="lang-seg">
                    <button data-value="de" lang="de">Deutsch</button>
                    <button data-value="en" lang="en">English</button>
                    <button data-value="system" data-i18n="lang.system"></button>
                  </div>
                </div>
                <div class="row">
                  <div class="row__text">
                    <h4 data-i18n="system.autostart"></h4>
                    <p id="autostart-note" data-i18n="system.autostartDesc"></p>
                  </div>
                  <button class="toggle" id="autostart" data-i18n-aria="system.autostart"></button>
                </div>
                <div class="row">
                  <div class="row__text">
                    <h4 data-i18n="system.idle"></h4>
                    <p data-i18n="system.idleDesc"></p>
                  </div>
                  <button class="toggle" id="idle-enabled" data-i18n-aria="system.idle"></button>
                </div>
                <div class="row" data-needs-idle>
                  <div class="row__text"><h4 data-i18n="system.idleAfter"></h4></div>
                  <div id="idle-threshold"></div>
                </div>
                <div class="row">
                  <div class="row__text">
                    <h4 data-i18n="system.chime"></h4>
                    <p data-i18n="system.chimeDesc"></p>
                  </div>
                  <button class="toggle" id="sound-chime" data-i18n-aria="system.chime"></button>
                </div>
                <div class="row">
                  <div class="row__text">
                    <h4 data-i18n="system.ocean"></h4>
                    <p data-i18n="system.oceanDesc"></p>
                  </div>
                  <button class="toggle" id="sound-ambient" data-i18n-aria="system.ocean"></button>
                </div>
                <div class="row">
                  <div class="row__text"><h4 data-i18n="system.volume"></h4></div>
                  <div class="slider" id="volume">
                    <input type="range" min="0" max="100" step="1" data-i18n-aria="system.volume" />
                    <span class="slider__value tabular"></span>
                  </div>
                </div>
                <div class="row" data-mac-only>
                  <div class="row__text">
                    <h4 data-i18n="system.trayCountdown"></h4>
                    <p data-i18n="system.trayCountdownDesc"></p>
                  </div>
                  <button class="toggle" id="tray-countdown" data-i18n-aria="system.trayCountdown"></button>
                </div>
              </div>

              <div class="mood" data-reveal>
                <p class="label" data-i18n="system.mood"></p>
                <div class="mood__stage">
                  <div class="mood__anchor" data-orb-anchor></div>
                </div>
                <div class="mood__swatches" id="palettes" role="radiogroup" data-i18n-aria="system.mood"></div>
                <p class="mood__name display" id="palette-name">&nbsp;</p>
              </div>
            </div>
          </section>

          <!-- outro -------------------------------------------------------->
          <footer class="outro" id="outro" data-section="outro">
            <div class="outro__anchor" data-orb-anchor></div>
            <h2 class="outro__title display" data-split data-i18n-html="outro.title"></h2>
            <div class="outro__meta">
              <span class="label" id="version">Atem</span>
              <button class="label outro__quit" id="quit" data-i18n="outro.quit"></button>
            </div>
          </footer>
        </main>
      </div>
    </div>

    <div class="cursor" aria-hidden="true">
      <div class="cursor__ring"><span class="cursor__label"></span></div>
      <div class="cursor__dot"></div>
    </div>

    <script src="./bundle.js"></script>
  </body>
</html>
