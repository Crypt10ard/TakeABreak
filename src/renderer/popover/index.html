<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Atem</title>
    <link rel="stylesheet" href="./bundle.css" />
  </head>
  <body>
    <div class="card" id="card">
      <header class="head">
        <div class="brand"><span class="brand__logo" aria-hidden="true"></span>Atem</div>
        <span class="chip" id="chip"><i aria-hidden="true"></i><span id="chip-text">&nbsp;</span></span>
      </header>

      <section class="dial" aria-live="polite">
        <div class="dial__orb" aria-hidden="true"></div>
        <svg class="dial__ring" viewBox="0 0 220 220" aria-hidden="true">
          <g class="dial__ticks"></g>
          <circle class="dial__track" cx="110" cy="110" r="92" />
          <circle class="dial__fill" id="dial-fill" cx="110" cy="110" r="92" />
          <g id="dial-knob"><circle class="dial__knob" cx="110" cy="18" r="5.5" /></g>
        </svg>
        <div class="dial__center">
          <span class="dial__num display tabular" id="num">0</span>
          <span class="dial__unit" id="unit">&nbsp;</span>
        </div>
      </section>

      <p class="caption" id="caption">&nbsp;</p>
      <p class="micro" id="micro">&nbsp;</p>

      <div class="actions">
        <button class="btn btn--primary btn--block" id="primary">
          <span id="primary-label">&nbsp;</span><span class="btn__arrow" aria-hidden="true">→</span>
        </button>
        <div class="pauserow" id="pauserow">
          <span class="label" data-i18n="pop.pause"></span>
          <div class="chips">
            <button data-pause="30" data-i18n="pop.p30"></button>
            <button data-pause="60" data-i18n="pop.p60"></button>
            <button data-pause="120" data-i18n="pop.p120"></button>
            <button data-pause="tomorrow" data-i18n="pop.tomorrow"></button>
          </div>
        </div>
      </div>

      <footer class="foot">
        <p class="today" id="today">&nbsp;</p>
        <div class="foot__links">
          <button id="settings" data-i18n="pop.settings"></button>
          <button id="quit" data-i18n="pop.quit"></button>
        </div>
      </footer>
    </div>
    <script src="./bundle.js"></script>
  </body>
</html>
